<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Analytics - HabitFlow</title>

  <!-- FIXED CSS PATHS -->
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/navbar.css">
  <link rel="stylesheet" href="/css/analytics.css">
</head>

<body>

<header class="main-header">
  <div class="logo">Habit<span>Flow</span></div>

  <nav class="navbar">
    <a href="/dashboard" class="nav-link">Dashboard</a>
    <a href="/add-habit" class="nav-link">Add Habit</a>
    <a href="/habits" class="nav-link">All Habits</a>
    <a href="/analytics" class="nav-link active">Analytics</a>
    <a href="#" onclick="logoutUser()" class="nav-link">Logout</a>
  </nav>

<div class="container">

  <!-- TITLE CARD -->
  <div class="stats-title-card">
    <h2>Your Stats</h2>
  </div>

  <!-- STATS BOX CONTAINER -->
  <div class="stats-box-container">

      <p>Total Habits</p>

    <div class="stat-box">
      <p>Completed Today</p>
      <h3 id="a-today">0</h3>
    </div>

    <div class="stat-box">
      <p>Best Streak</p>
      <h3 id="a-best">0</h3>
    </div>

  </div>

</div>

<script src="/js/config.js"></script>
