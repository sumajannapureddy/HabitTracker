<!DOCTYPE html>
<html>
<head>
    <title>Admin Register — HabitFlow</title>

    <!-- FIXED: Use existing CSS files only -->
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/navbar.css">
</head>

<body>

    <div class="container">
        <div class="card">
            <h1>Admin Registration</h1>

            <form id="adminRegisterForm">
                <label>Admin Name</label>
                <input type="text" id="admin-name" placeholder="Enter admin name" required>

                <label>Email</label>
                <input type="email" id="admin-email" placeholder="Enter admin email" required>

                <label>Password</label>
                <input type="password" id="admin-password" placeholder="Create admin password" required>

                <button class="btn primary" type="submit">Register</button>
            </form>
        </div>
    </div>

    <!-- JS (both exist in your project) -->
    <script src="/js/config.js"></script>
    <script src="/js/admin-register.js"></script>

</body>
</html>
