<!DOCTYPE html>
<html>

</head>

<body>

    <div class="container">
        <div class="card">
            <h1>Admin Login</h1>

            <form id="adminLoginForm">

                <button class="btn primary" type="submit">Login</button>

        </div>
    </div>

    <!-- JS FILES (all exist) -->

    <script src="/js/auth.js"></script>
    <script src="/js/admin-login.js"></script>

</body>
</html>
