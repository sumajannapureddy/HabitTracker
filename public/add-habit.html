<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Habit - HabitFlow</title>

  <!-- FIXED CSS PATHS -->
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/navbar.css">
  <link rel="stylesheet" href="/css/add-habit.css">
</head>
<body>

<header class="main-header">
  <div class="logo">Habit<span>Flow</span></div>

  <nav class="navbar">
    <a href="/dashboard" class="nav-link">Dashboard</a>
    <a href="/add-habit" class="nav-link active">Add Habit</a>
    <a href="/habits" class="nav-link">All Habits</a>
    <a href="/analytics" class="nav-link">Analytics</a>
    <a href="#" onclick="logoutUser()" class="nav-link">Logout</a>
  </nav>
</header>

<main class="container">

  <section class="card form-card">
    <h2>Create New Habit</h2>

    <form id="add-habit-form">

      <label>Habit Name</label>
      <input id="habit-name" type="text" required>

      <label>Category</label>
      <select id="habit-category">
        <option>Health</option>
        <option>Study</option>
        <option>Career</option>
        <option>Personal Growth</option>
        <option>Custom</option>
      </select>

      <label>Frequency</label>
      <select id="habit-frequency">
        <option>Daily</option>
        <option>Weekly</option>
      </select>

      <label>Start Date</label>
      <input type="date" id="habit-start-date">

      <label>Notes</label>
      <textarea id="habit-notes" rows="3"></textarea>

      <button type="submit" class="btn primary">Add Habit</button>

    </form>
  </section>

</main>

<!-- JS FILES IN CORRECT ORDER -->
<script src="/js/config.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/auth-check.js"></script>

<script>
  const user_id = requireLogin();
</script>

<script src="/js/addHabit.js"></script>

</body>
</html>
